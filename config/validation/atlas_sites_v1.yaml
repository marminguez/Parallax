# Parallax — VAL-003: model v2 (relief + bare ground) on an independent site list
#
# Frozen BEFORE evaluation (2026-10-13), after VAL-001 and VAL-002 were run.
# Model v1 (slope fingerprint only) recognised analog terrain (AUC ~0.76) but
# vegetation and land cover were not part of the score. Model v2 below adds the
# share of bare / sparsely vegetated ground, a physical property of every Moon
# and Mars surface, with a weight fixed here and never tuned afterwards.
#
# Test set: the site list compiled by ANOTHER Space Apps 2026 team, Analog Atlas
# (https://github.com/clickTwice26/nasc, data/analogs.json at commit
# 4206f437defec2b61221e8994983fa689d1629f1). MIT License, Copyright (c) 2026
# Analog Atlas contributors. Copied verbatim below (fields we use), so we did not
# choose the sites. Results are reported whatever they are.

id: VAL-003
version: "1.0"
frozen_on: "2026-10-13"
site_list_source:
  project: Analog Atlas (Space Apps 2026)
  url: https://github.com/clickTwice26/nasc/blob/4206f437defec2b61221e8994983fa689d1629f1/data/analogs.json
  commit: 4206f437defec2b61221e8994983fa689d1629f1
  license: "MIT License, Copyright (c) 2026 Analog Atlas contributors"

models:
  v1:
    description: "EXP-001B slope fingerprint only (as in VAL-001/002)."
    distance: "d1 = JSD(target 1 km slope histogram, window histogram)"
  v2:
    description: "Relief plus bare ground, equal weights, both on a 0-1 scale."
    distance: "d2 = 0.5 * d1 + 0.5 * (1 - b)"
    bare_ground: "b = share of the 50 x 50 km window classified 'Bare / sparse vegetation' (class 60) in ESA WorldCover 2021 v200, 100 m nearest-neighbour samples, as in scripts/land_cover.py"
    target_bare_ground: "1.0 for both Jezero and Shackleton: no vegetation, water or built surfaces on the Moon or Mars"
    land_cover_eligibility: "WorldCover classified coverage >= 0.99 of the window; otherwise the window is reported and excluded from v2"

selection:
  coverage_latitudes: [-55, 59]
  land_fraction_min: 0.90
  exclude_facilities: true      # indoor/underwater habitats (Atlas field facility = true)
  positives:
    mars: "sites with 'mars' in analog_for -> scored against Jezero"
    moon: "sites with 'moon' in analog_for -> scored against Shackleton"

null_distribution: "The 224 eligible EXP-001B index windows that do not overlap any test site, each with slope histogram and WorldCover characterization."

metrics: "AUC, median percentile, top decile and 10,000-draw one-sided permutation p (seed 2026), exactly as VAL-001. Model comparison: paired bootstrap over sites of AUC(v2) - AUC(v1), 10,000 draws, seed 2026, 95% interval."

hypotheses:
  H5: "Model v2, Mars-use sites vs Jezero: AUC > 0.5, permutation p < 0.05."
  H6: "Model v2, Moon-use sites vs Shackleton: AUC > 0.5, permutation p < 0.05."
  H7: "Model v2 beats model v1 on the same sites: the 95% bootstrap interval of AUC(v2) - AUC(v1) lies above 0, for Mars and for Moon separately."
  secondary:
    - "Unseen subset: the same analyses excluding sites whose window overlaps a VAL-001 or VAL-002 site."
    - "Atlas theme rule for Jezero (themes arid or evaporite), descriptive comparison with the AUC Analog Atlas reports for its own model (0.831); negatives differ (all land cells vs our systematic sample)."
  note: "Process and habitat analogs (e.g. Pavilion Lake microbialites, HI-SEAS) are kept: the rule, not our judgement, decides."

