# Parallax — VAL-004 overlays (sites shown on the reverse map)
#
# Frozen with config/validation/val004_reverse_map_v1.yaml (2026-10-28).
# Overlays never change the map; they only report which window a site falls in.
# Longitudes are east-positive in -180..180 (ODE gives 0..360 E; converted as lon - 360 when > 180).

mars_landing_sites:
  source: "PDS Geosciences Node ODE, 'Existing and Proposed Landing Sites' (Doppler/radiometric solutions where two are given)"
  source_url: https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm
  sites:
    - {id: viking-1, name: "Viking 1 (Chryse Planitia)", kind: landed, lat: 22.269, lon: -47.951}
    - {id: viking-2, name: "Viking 2 (Utopia Planitia)", kind: landed, lat: 47.668, lon: 134.280}
    - {id: pathfinder, name: "Mars Pathfinder (Ares Vallis)", kind: landed, lat: 19.095, lon: -33.253}
    - {id: spirit, name: "Spirit (Gusev crater)", kind: landed, lat: -14.571892, lon: 175.47848}
    - {id: opportunity, name: "Opportunity (Meridiani Planum)", kind: landed, lat: -1.9483, lon: -5.52583}
    - {id: phoenix, name: "Phoenix (Vastitas Borealis)", kind: landed, lat: 68.22, lon: -125.75}
    - {id: curiosity, name: "Curiosity (Gale crater)", kind: landed, lat: -4.59, lon: 137.44}
    - {id: eberswalde, name: "Eberswalde (MSL finalist)", kind: candidate, lat: -23.8953, lon: -33.2574}
    - {id: holden, name: "Holden crater (MSL finalist)", kind: candidate, lat: -26.4007, lon: -34.8385}
    - {id: mawrth, name: "Mawrth Vallis (MSL finalist)", kind: candidate, lat: 23.9883, lon: -18.9601}
  also:
    - {id: perseverance, name: "Perseverance (Jezero crater)", kind: landed, lat: 18.44463, lon: 77.45088, source: "frozen Jezero reference v0.4 centre"}

