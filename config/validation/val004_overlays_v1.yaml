    (lunar south pole, polar stereographic, with a latitude/longitude grid),
    write lat/lon with two decimals and set method: "digitised from NASA map".
    Commit this file BEFORE running scripts/val004_twins.py. Anything added
    after the first run belongs in a v2 file.
