# Parallax — VAL-004 overlays (sites shown on the reverse map)
#
# Frozen with config/validation/val004_reverse_map_v1.yaml (2026-10-28).
# Overlays never change the map; they only report which window a site falls in.
# Longitudes are east-positive in -180..180 (ODE gives 0..360 E; converted as lon - 360 when > 180).

