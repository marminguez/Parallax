# Parallax — VAL-001: blind recovery of established planetary analogs
#
# Frozen BEFORE any of these sites was evaluated by Parallax (2026-10-13).
# The ranking model has never seen these names or coordinates: the index is a
# deterministic systematic sample (EXP-001B) and both planetary references were
# frozen before Earth discovery. Results are reported whatever they are.
#
# Question: do sites that space agencies and researchers already use as Moon
# or Mars analogs look more like the planetary reference than a typical Earth
# window does, judged only by Parallax's 1 km slope-distribution distance?

id: VAL-001
version: "1.0"
frozen_on: "2026-10-13"

method:
  measurement: "Same as EXP-001B: 50 x 50 km local AEQD window, SRTMGL30 at 1 km, MOD44W land stencil, 8 frozen slope classes."
  distance: "Base-2 Jensen-Shannon distance between the site's slope histogram and the target's (lower = more similar)."
  null_distribution: "The eligible windows of the EXP-001B measured index (web/data/earth-slope-histograms.csv), excluding any index window whose 50 km footprint overlaps an analog site window."
  eligibility: "Same rule as the index: land fraction >= 0.90. Ineligible or unevaluable sites are reported, never dropped silently."
  slope_cap: none   # pure morphology similarity; no rover slope cap
  metrics:
    percentile: "Share of null windows at least as close to the target as the site (lower is better; ties count half)."
    auc: "Mean over sites of P(null window farther than site) — 0.5 = no better than a random Earth window, 1.0 = closer than every window."
    permutation_test: "One-sided p-value: share of 10,000 random sets of n null windows (seed 2026) whose AUC against the remaining null is >= the observed AUC."
    top_decile: "Number of sites in the closest 10% of the null."

hypotheses:
  H1: "Mars-use analogs are closer to Jezero than typical Earth windows: AUC > 0.5, permutation p < 0.05."
  H2: "Moon-use analogs are closer to Shackleton than typical Earth windows: AUC > 0.5, permutation p < 0.05."
  note: "Many of these sites were chosen for chemistry, aridity, geology or logistics, not regional slopes, so a null result is plausible and will be reported. Small n (especially Moon) limits statistical power."
  exploratory: "Cross-checks (Mars analogs vs Shackleton, Moon analogs vs Jezero) are reported as exploratory only."

coverage:
  srtmgl30_latitudes: [-55, 59]

