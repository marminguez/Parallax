# Parallax — VAL-002: blind test on Apollo astronaut geology-training sites
#
# Frozen BEFORE evaluation (2026-10-13), after VAL-001 had been run.
# Purpose: VAL-001 had only three eligible Moon-use sites (H2: AUC 0.74,
# p = 0.08). VAL-002 adds an independent set chosen by a fixed rule, with the
# model, references, null distribution and metrics left exactly as in VAL-001.
#
# Selection rule:
#   1. Start from every geology field-training location listed for Apollo in
#      Wikipedia, "Apollo program training" (fetched 2026-10-13).
#   2. For each location, use the specific feature whose own Wikipedia article
#      states that Apollo astronauts trained there. If none exists, use the
#      location's own Wikipedia coordinates and mark it "representative".
#   3. Exclude, and report, locations outside the elevation data's coverage,
#      locations already in VAL-001 or whose 50 km window overlaps a VAL-001
#      site, and locations with no identifiable place.
#
# Caution recorded in advance: Apollo training targeted geological recognition
# (volcanic and impact features) for equatorial landing sites, not the
# morphology of the lunar south pole. A null result is plausible.

id: VAL-002
version: "1.0"
frozen_on: "2026-10-13"
selection_source: https://en.wikipedia.org/wiki/Apollo_program_training

method: "Identical to VAL-001 (config/validation/known_analogs_v1.yaml): same measurement, distance, null distribution, eligibility, metrics, 10,000 permutations, seed 2026."

primary:
  moon: shackleton

hypotheses:
  H3: "Apollo geology-training sites are closer to Shackleton than typical Earth windows: AUC > 0.5, permutation p < 0.05."
  H4: "Pooled Moon-use sites (VAL-001 moon group + VAL-002) are closer to Shackleton than typical Earth windows: AUC > 0.5, permutation p < 0.05."
  exploratory: "Apollo training sites vs Jezero."

pooled_with:
  config: config/validation/known_analogs_v1.yaml
  group: moon

coverage:
  srtmgl30_latitudes: [-55, 59]

sites:
  - id: katmai-ten-thousand-smokes
    name: Valley of Ten Thousand Smokes, Katmai, Alaska
    country: US
    lat: 58.39389
    lon: -155.38528
    groups: [moon]
    used_for: "Apollo geology training, 1965 and 1966 (volcanic features)"
    coordinate_source: "Wikipedia, Valley of Ten Thousand Smokes"
    source_url: https://en.wikipedia.org/wiki/Valley_of_Ten_Thousand_Smokes
  - id: newberry-volcano
    name: Newberry Volcano, Oregon
    country: US
    lat: 43.689195
    lon: -121.254890
    groups: [moon]
    used_for: "Apollo geology training, 1964 and 1966 (Apollo 11, 12, 14, 15, 16 crew members)"
    coordinate_source: "Wikipedia, Newberry Volcano (Paulina Peak)"
    source_url: https://en.wikipedia.org/wiki/Newberry_Volcano
  - id: rio-grande-gorge
    name: Rio Grande Gorge, New Mexico
    country: US
    lat: 36.47611
    lon: -105.73222
    groups: [moon]
    used_for: "Apollo 15-17 geology training, 1971 (resemblance to the Apollo 15 site)"
    coordinate_source: "Wikipedia, Rio Grande Gorge Bridge (the Rio Grande Gorge article states the training but gives no coordinates)"
    source_url: https://en.wikipedia.org/wiki/Rio_Grande_Gorge
  - id: orocopia-mountains
    name: Orocopia Mountains, California
    country: US
    lat: 33.56667
    lon: -115.77583
    groups: [moon]
    used_for: "Apollo 13, 15, 16, 17 geology training, 1969-1972"
    coordinate_source: "Wikipedia, Orocopia Mountains"
    source_url: https://en.wikipedia.org/wiki/Orocopia_Mountains
  - id: sudbury-basin
    name: Sudbury Basin, Ontario
    country: CA
    lat: 46.600
    lon: -81.183
    groups: [moon]
    used_for: "Apollo 15-17 training on impact-formed rocks"
    coordinate_source: "Wikipedia, Sudbury Basin"
    source_url: https://en.wikipedia.org/wiki/Sudbury_Basin
  - id: nordlinger-ries
    name: Nördlinger Ries, Germany
    country: DE
    lat: 48.883
    lon: 10.567
    groups: [moon]
    used_for: "Apollo 14 and Apollo 17 impact-crater training"
    coordinate_source: "Wikipedia, Nördlinger Ries"
    source_url: https://en.wikipedia.org/wiki/N%C3%B6rdlinger_Ries
  - id: grand-canyon
    name: Grand Canyon, Arizona
    country: US
    lat: 36.3
    lon: -112.75
    groups: [moon]
    used_for: "Apollo geology training (listed in the selection source)"
    coordinate_source: "Representative: Wikipedia, Grand Canyon (no specific training point stated)"
    source_url: https://en.wikipedia.org/wiki/Grand_Canyon
  - id: nevada-test-site
    name: Nevada Test Site (Yucca Flat area)
    country: US
    lat: 37.117
    lon: -116.050
    groups: [moon]
    used_for: "Apollo training on nuclear craters (listed in the selection source)"
    coordinate_source: "Representative: Wikipedia, Nevada Test Site"
    source_url: https://en.wikipedia.org/wiki/Nevada_Test_Site

not_evaluable:
  - {name: Meteor Crater, reason: "Already in VAL-001"}
  - {name: Cinder Lake Crater Fields, reason: "50 km window overlaps the VAL-001 SP Crater site"}
  - {name: "Volcanic fields, Hawaii (Kīlauea)", reason: "50 km window overlaps the VAL-001 Mauna Kea site"}
  - {name: "Lake Mývatn and Askja, Iceland", reason: "65° N, outside coverage"}
  - {name: "Formations in west Texas", reason: "No identifiable place in the source; Big Bend's article does not state Apollo training"}
  - {name: "Black Mesa, Verde Valley", reason: "Ambiguous place name; no article stating Apollo training"}
