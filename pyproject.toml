[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-engine"
version = "0.1.0"
description = "Mission-specific planetary analog discovery from planetary and Earth observation data."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyyaml>=6.0"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.14", "xarray>=2024.1"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
